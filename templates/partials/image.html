<section class="vpane" id="v-image" hidden>
  <div class="toolbar">
    <button class="icon-btn" id="imgOut" title="Zoom out ( - )" aria-label="Zoom out"><i data-icon="zoomOut"></i></button>
    <span class="badge" id="imgZoom">100%</span>
    <button class="icon-btn" id="imgIn" title="Zoom in ( + )" aria-label="Zoom in"><i data-icon="zoomIn"></i></button>
    <button class="btn ghost" id="imgFit" title="Fit to window ( 0 )">Fit</button>
    <span class="spacer"></span><span class="badge" id="imgInfo"></span>
    <button class="icon-btn" id="imgMore" title="More actions" aria-label="More actions" aria-haspopup="menu"><i data-icon="more"></i></button>
  </div>
  <div id="imgStage" tabindex="0"><img id="imgEl" alt="" draggable="false"></div>
</section>
