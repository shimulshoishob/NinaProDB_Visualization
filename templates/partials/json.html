<section class="vpane" id="v-json" hidden>
      <div class="toolbar">
        <span class="title" id="jsonName"></span><span class="badge" id="jsonMeta"></span>
        <span class="spacer"></span>
        <input id="q" type="search" placeholder="Search keys & values…  (Ctrl+F)" style="width:240px">
        <span id="qInfo" class="badge" hidden></span>
        <button class="icon-btn" id="qPrev" title="Previous match (Shift+Enter)" aria-label="Previous match" hidden><i data-icon="chevUp"></i></button>
        <button class="icon-btn" id="qNext" title="Next match (Enter)" aria-label="Next match" hidden><i data-icon="chevDown"></i></button>
        <div class="seg" id="jsonModes"><button data-m="tree" class="active">Tree</button><button data-m="table">Table</button><button data-m="raw">Raw</button></div>
        <button class="icon-btn" id="jsonMore" title="More: expand, collapse, copy, download" aria-label="More actions" aria-haspopup="menu"><i data-icon="more"></i></button>
      </div>
      <div id="pathBar"><span class="mono" id="pathText">$</span><button class="icon-btn" id="copyPath" title="Copy path">⧉</button></div>
      <div id="body"></div>
    </section>
