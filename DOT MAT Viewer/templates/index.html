<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NinaPro .mat Viewer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">NinaPro <b>.mat</b> Viewer</div>
  <label class="btn primary">Open .mat file…
    <input type="file" id="fileInput" accept=".mat" hidden>
  </label>
  <select id="localSelect" title="Files in the data/ folder"><option value="">Open from data/ folder…</option></select>
  <span class="spacer"></span>
  <button class="btn" id="csvBtn" disabled>Export sheet as CSV</button>
  <button class="btn" id="zipBtn" disabled>Export all (ZIP)</button>
</header>

<div class="formula" id="formulaBar">
  <input id="nameBox" value="" readonly>
  <span class="fx">fx</span>
  <input id="formulaBox" readonly>
  <span class="goto">Go to row <input id="gotoRow" type="number" min="1" placeholder="#"></span>
</div>

<div id="viewer" tabindex="0">
  <div id="empty">
    <h2>Drop a NinaPro <code>.mat</code> file here</h2>
    <p>or use <b>Open .mat file…</b> above. Each variable (emg, glove, stimulus, …) becomes a sheet.</p>
  </div>
  <div id="spacer" hidden><div id="layer"></div></div>
</div>

<footer>
  <div id="tabs"></div>
  <div id="status">Ready</div>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
