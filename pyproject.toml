[project]
name = "ninapro-study-workspace"
version = "1.0.0"
description = "A local study workspace for reading, annotating and organising PDFs, code, MAT data and notes."
requires-python = ">=3.9"

[tool.ruff]
exclude = [".venv", "static/vendor", "data"]
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM", "PLE"]
ignore = [
  "B008",    # Flask/route defaults are fine
  "SIM108",  # explicit if/else is clearer than a ternary in places
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
